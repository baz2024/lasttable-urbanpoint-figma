<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastTable — Profile</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#0E7F84}a:hover{color:#0B7378}
.ico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:0;background:#F5F5F5;color:#1C1C1C;cursor:pointer;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;background:#F5F5F5;color:#1C1C1C;font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;border:0;cursor:pointer;white-space:nowrap;flex:none}
.chip.sel{background:#0E7F84;color:#fff}
.logo{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 14px 'Plus Jakarta Sans',system-ui,sans-serif;color:#fff;flex:none;letter-spacing:-.02em}
.logo.ring{background:#fff;color:#1C1C1C;border:1px solid #E6E6E6}
.rrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #EEEEEE;text-decoration:none;color:#1C1C1C}
.rrow .t{font-size:15px;font-weight:700;line-height:20px}
.rrow .s{font-size:13px;color:#666666;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw{position:relative}
.heart{position:absolute;right:-10px;top:18px;width:44px;height:44px;border:0;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#0E7F84;cursor:pointer}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:16px;background:#F5F5F5;flex:1}
.stat .n{font-size:22px;font-weight:800;line-height:26px;letter-spacing:-.01em}
.stat .l{font-size:12px;font-weight:600;color:#666666}
.prow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #EEEEEE;text-decoration:none;color:#1C1C1C;font:600 15px/20px 'Plus Jakarta Sans',system-ui,sans-serif}
.prow .pi{width:40px;height:40px;border-radius:12px;background:#E3F6F4;color:#0E7F84;display:flex;align-items:center;justify-content:center;flex:none}
.h2{margin:0;font-size:18px;font-weight:700;line-height:24px}
.nav{display:flex;justify-content:space-around;align-items:flex-start;padding:10px 8px 0;border-top:1px solid #EEEEEE;background:#fff;height:84px;box-sizing:border-box;flex:none}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;text-decoration:none;color:#1C1C1C;font:600 12px/14px 'Plus Jakarta Sans',system-ui,sans-serif;padding:4px 0}
.nav a.on{color:#E3111B}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1C1C1C; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 56px 20px 0">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: #E3F6F4; color: #0E7F84; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex: none">B</div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 30px; letter-spacing: -.01em">Basel</h1>
        <div style="font-size: 13px; color: #666666">Dublin 2 · Member since 2024</div>
      </div>
      <a class="ico" href="#settings" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></a>
    </div>

    <div style="display: flex; gap: 10px">
      <div class="stat"><span class="n">12</span><span class="l">Saved places</span></div>
      <div class="stat"><span class="n">4</span><span class="l">Bookings</span></div>
      <div class="stat" style="background: #E3F6F4"><span class="n" style="color: #0B7378">3</span><span class="l" style="color: #0B7378">Collections</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><h2 class="h2">Saved places</h2><a href="Listing.dc.html" style="font-size: 14px; font-weight: 700; color: #E3111B; text-decoration: none">See all</a></div>
      <div style="display: flex; gap: 8px; margin: 0 -20px; padding: 0 20px; overflow: hidden">
        <button class="chip sel">Restaurants</button>
        <button class="chip">Offers</button>
        <button class="chip">Collections</button>
      </div>
      <div style="display: flex; flex-direction: column">
        <div class="rw"><a class="rrow" href="Details.dc.html">
          <div class="logo" style="background: #1B6B4A">ON</div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; padding-right: 36px"><div class="t">Osteria Nove</div><div class="s">Italian · 0.8 km · 3 tables tonight</div></div>
        </a><button class="heart" type="button" aria-label="Remove from saved" aria-pressed="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8.2a4.2 4.2 0 0 1 7.5 2.3c0 5.4-7.5 10-7.5 10Z"/></svg></button></div>
        <div class="rw"><a class="rrow" href="Details.dc.html">
          <div class="logo" style="background: #B8382B">SY</div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; padding-right: 36px"><div class="t">The Salt Yard</div><div class="s">Modern Irish · 1.9 km · 2 tables tonight</div></div>
        </a><button class="heart" type="button" aria-label="Remove from saved" aria-pressed="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8.2a4.2 4.2 0 0 1 7.5 2.3c0 5.4-7.5 10-7.5 10Z"/></svg></button></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 class="h2">Account</h2>
      <div style="display: flex; flex-direction: column">
        <a class="prow" href="#details"><span class="pi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span style="flex: 1">Personal details</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
        <a class="prow" href="#bookings"><span class="pi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3m8-3v3M3 9h18M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg></span><span style="flex: 1">My bookings</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
        <a class="prow" href="#notif" style="border-bottom: 0"><span class="pi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/></svg></span><span style="flex: 1">Notifications</span><span style="width: 44px; height: 26px; border-radius: 999px; background: #0E7F84; position: relative" aria-label="Notifications on"><span style="position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff"></span></span></a>
      </div>
    </div>
  </div>

  <nav class="nav" aria-label="Main">
    <a href="Discover.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10h14M5 10v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7M5 10l1.5-5h11L19 10"/><path d="M9 19v-5h6v5"/></svg>Explore</a>
    <a href="Saved.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8.2a4.2 4.2 0 0 1 7.5 2.3c0 5.4-7.5 10-7.5 10Z"/></svg>Saved</a>
    <a href="Listing.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg>Map</a>
    <a href="Listing.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>Search</a>
    <a class="on" href="Saved.dc.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile</a>
  </nav>
</div>

</body>
</html>
