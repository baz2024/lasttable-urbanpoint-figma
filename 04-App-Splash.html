<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastTable — Splash</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FB1D26}
a{color:#fff}a:hover{color:#fff}
@keyframes lt-pop{0%{opacity:0;transform:scale(.72)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes lt-rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes lt-ring{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes lt-dot{0%,80%,100%{opacity:.35;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.mark{animation:lt-pop .6s cubic-bezier(.2,.8,.2,1) both}
.word{animation:lt-rise .5s .25s cubic-bezier(.2,.8,.2,1) both}
.tag{animation:lt-rise .5s .4s cubic-bezier(.2,.8,.2,1) both}
.ring{animation:lt-ring 1.1s cubic-bezier(.2,.8,.2,1) both}
.ring.r2{animation-delay:.12s}.ring.r3{animation-delay:.24s}
.dot{animation:lt-dot 1.2s ease-in-out infinite}
.dot.d2{animation-delay:.2s}.dot.d3{animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.mark,.word,.tag,.ring,.dot{animation:none}}
</style>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FB1D26; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center">
  <div class="ring r3" style="position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.10)"></div>
  <div class="ring r2" style="position: absolute; left: 50%; top: 50%; width: 540px; height: 540px; margin: -270px 0 0 -270px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.14)"></div>
  <div class="ring" style="position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; background: rgba(255,255,255,.08)"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; margin-top: -24px">
    <div class="mark" style="width: 112px; height: 112px; border-radius: 32px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(120,0,8,.28)">
      <svg width="68" height="68" viewBox="0 0 68 68" fill="none" role="img" aria-label="LastTable mark">
        <rect x="8" y="22" width="52" height="12" rx="6" fill="#E3111B"/>
        <rect x="16" y="34" width="8" height="24" rx="4" fill="#E3111B"/>
        <rect x="44" y="34" width="8" height="24" rx="4" fill="#E3111B"/>
        <circle cx="34" cy="16" r="9" fill="#ffffff" stroke="#E3111B" stroke-width="3.5"/>
        <path d="M34 11v5l3.2 2" stroke="#E3111B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="word" style="font-size: 36px; font-weight: 800; line-height: 40px; letter-spacing: -.025em">LastTable</div>
    <div class="tag" style="font-size: 15px; font-weight: 600; line-height: 20px; color: rgba(255,255,255,.88); letter-spacing: .005em">Late tables, lower prices</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 64px; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <div style="display: flex; gap: 8px" aria-hidden="true">
      <span class="dot" style="width: 8px; height: 8px; border-radius: 50%; background: #fff"></span>
      <span class="dot d2" style="width: 8px; height: 8px; border-radius: 50%; background: #fff"></span>
      <span class="dot d3" style="width: 8px; height: 8px; border-radius: 50%; background: #fff"></span>
    </div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7)">Dublin · Tonight</div>
  </div>
</div>

</body>
</html>
